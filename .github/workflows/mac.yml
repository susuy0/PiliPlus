name: Build for Mac

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:
  push:
    branches: [vertical-feed]
    paths:
      - 'lib/**'
      - 'macos/**'
      - 'pubspec.*'
      - 'tool/ui_redesign_test.dart'
      - '.github/workflows/mac.yml'

permissions:
  contents: read

concurrency:
  group: mac-feed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac-app:
    name: Release Mac
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 macOS

      - name: Analyze source
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Check feed and desktop interactions
        run: |
          dart tool/check_vertical_feed.dart
          dart tool/check_feed_preload.dart
          flutter test --no-pub --timeout 2m --reporter expanded tool/ui_redesign_test.dart

      - name: Build Mac
        run: flutter build macos --release --dart-define-from-file=pili_release.json --no-pub

      - name: Verify and package Mac app
        run: |
          app="build/macos/Build/Products/Release/PiliPlus.app"
          codesign --verify --deep --strict "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          lipo -archs "$app/Contents/MacOS/$executable" > macOS-validation.txt
          codesign -dv "$app" 2>> macOS-validation.txt
          mkdir -p build/dmg-stage
          ditto "$app" build/dmg-stage/PiliPlus.app
          ln -s /Applications build/dmg-stage/Applications
          hdiutil create -volname PiliPlus -srcfolder build/dmg-stage -ov -format UDZO "PiliPlus_macos_${{ env.version }}.dmg"
          ditto -c -k --keepParent "$app" "PiliPlus_macos_${{ env.version }}.app.zip"
          shasum -a 256 PiliPlus_macos_*.dmg PiliPlus_macos_*.app.zip >> macOS-validation.txt

      - name: Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: |
            PiliPlus_macos_*.dmg

      - name: Upload macos release
        uses: actions/upload-artifact@v7
        with:
          name: macOS-release
          path: |
            PiliPlus_macos_*.dmg
            PiliPlus_macos_*.app.zip
            macOS-validation.txt
